<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WikiMasters — Ouverture de paquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PACK OPENING — elegant, flat, no gradients, no glow.
   Restraint does the work: solid surfaces, hairline rules,
   one accent, precise type. Rarity = a single flat colour mark.
   ============================================================ */
:root{
  --bg:#0C0D0C; --surface:#141613; --elev:#191C18; --line:#282C27; --line-2:#333833;
  --fg:#ECEEE9; --fg-soft:#9AA298; --fg-faint:#636A61;
  --accent:#3CCB8E;              /* used solid, sparingly */
  /* rarity, slightly muted from neon for a printed feel */
  --r-c:#9FD8BC; --r-pc:#9DBDE4; --r-r:#B69CDE; --r-sr:#E07CA4; --r-ur:#E28F32; --r-l:#E4C63C;
  --display:"Outfit",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  --pad:clamp(16px,4vw,52px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100vh;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

.bar{display:flex;align-items:center;justify-content:space-between;padding:16px var(--pad);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--accent);display:block}
.right{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;color:var(--fg-soft);
  background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:8px}
.pill b{color:var(--fg);font-weight:600}
.pill .d{width:7px;height:7px;border-radius:50%}
.pill .d.g{background:var(--accent)} .pill .d.y{background:var(--r-l)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(28px,6vh,72px) var(--pad);text-align:center;width:100%}

/* ---- READY ---- */
.ready{display:flex;flex-direction:column;align-items:center;gap:28px}
.ready h1{font-family:var(--display);font-size:clamp(24px,3.4vw,36px);font-weight:700;letter-spacing:-.02em}
.ready .sub{color:var(--fg-soft);font-size:15px;margin-top:-14px}

/* pack back: a matte printed card, flat */
.pack{position:relative;width:clamp(196px,24vw,272px);aspect-ratio:63/88;border-radius:14px;cursor:pointer;
  background:var(--elev);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),border-color .25s}
.pack:hover{transform:translateY(-6px);border-color:var(--accent)}
.pack .plate{position:absolute;inset:12px;border:1px solid var(--line);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pack .mono{width:60px;height:60px;border:1.5px solid var(--fg-faint);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:26px;color:var(--fg-soft)}
.pack .cap{font-size:11.5px;letter-spacing:.14em;color:var(--fg-faint);text-transform:uppercase}
.pack.busy{transition:transform .5s ease,opacity .45s ease}
.pack.busy{transform:translateY(-6px) scale(.96);opacity:0}

.cta{font-family:var(--display);font-weight:600;font-size:15px;color:#07130E;background:var(--accent);
  border:none;padding:13px 30px;border-radius:10px;cursor:pointer;transition:filter .15s,transform .15s}
.cta:hover{filter:brightness(1.05);transform:translateY(-1px)}
.hint{color:var(--fg-faint);font-size:13px}

/* ---- REVEAL ---- */
.reveal{display:none;flex-direction:column;align-items:center;gap:30px;width:100%;max-width:1200px}
.rhead{font-family:var(--display);font-size:clamp(19px,2.4vw,24px);font-weight:600}
.rhead span{color:var(--fg-faint);font-weight:400;font-size:15px}
.fan{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,1.5vw,20px);width:100%;perspective:1600px}
.slot{aspect-ratio:63/92}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transform:rotateY(0) translateY(18px);opacity:0;
  transition:transform .55s cubic-bezier(.3,.8,.3,1),opacity .35s}
.flip.shown{transform:rotateY(180deg) translateY(0);opacity:1}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden}
.back{background:var(--elev);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.back i{width:34px;height:34px;border:1.5px solid var(--fg-faint);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--fg-faint);font-size:15px}
.front{transform:rotateY(180deg);background:var(--elev);border:1px solid var(--line);display:flex;flex-direction:column}
.front.hi{border-color:var(--rc)}          /* rare+: a precise coloured border, no glow */
.front .bar{height:3px;flex:none;background:var(--rc)}
.front img{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
.front .m{flex:none;padding:9px 11px;display:flex;flex-direction:column;justify-content:center}
.front .m .n{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.12}
.front .m .r{font-size:11px;color:var(--rc);margin-top:3px}
.front .new{position:absolute;top:9px;right:9px;background:var(--fg);color:#0C0D0C;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--display);font-weight:600;font-size:14.5px;padding:12px 24px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line-2);background:transparent;color:var(--fg);transition:.15s}
.btn:hover{border-color:var(--fg-soft)}
.btn.primary{background:var(--accent);color:#07130E;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}

@media(prefers-reduced-motion:reduce){.flip{transition:opacity .3s}.flip.shown{transform:rotateY(180deg)}.pack.busy{transition:none}}
@media(max-width:720px){.fan{grid-template-columns:repeat(3,1fr)}}
@media(max-width:430px){.fan{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <header class="bar">
    <div class="brand"><i></i>WikiMasters</div>
    <div class="right">
      <div class="pill"><span class="d g"></span><b>3</b> paquets</div>
      <div class="pill"><span class="d y"></span><b>113</b></div>
    </div>
  </header>

  <main class="stage">
    <section class="ready" id="ready">
      <h1>Paquet du jour</h1>
      <div class="sub">5 cartes</div>
      <div class="pack" id="pack" onclick="openPack()">
        <div class="plate">
          <div class="mono">W</div>
          <div class="cap">Wiki&nbsp;Masters</div>
        </div>
      </div>
      <button class="cta" onclick="openPack()">Ouvrir le paquet</button>
      <div class="hint">Prochain paquet gratuit dans 3 h 12 min</div>
    </section>

    <section class="reveal" id="revealScreen">
      <div class="rhead">Vos cartes <span>· 2 nouvelles</span></div>
      <div class="fan" id="fan"></div>
      <div class="actions">
        <button class="btn primary" onclick="location.reload()">Ajouter à la collection</button>
        <button class="btn" onclick="location.reload()">Ouvrir un autre</button>
      </div>
    </section>
  </main>

<script>
const RC={c:['Commun','var(--r-c)',0],pc:['Peu commun','var(--r-pc)',0],r:['Rare','var(--r-r)',1],sr:['Super rare','var(--r-sr)',1],ur:['Ultra rare','var(--r-ur)',1],l:['Légendaire','var(--r-l)',1]};
const pull=[
 ['pieuvre','jpg','Pieuvre','c',false],
 ['mont-fuji','jpg','Mont Fuji','pc',false],
 ['ada-lovelace','png','Ada Lovelace','r',true],
 ['cleopatre-vii','jpg','Cléopâtre VII','sr',false],
 ['albert-einstein','jpg','Albert Einstein','l',true],
];
document.getElementById('fan').innerHTML=pull.map(([s,e,n,r,isNew])=>{
 const[label,col,hi]=RC[r];
 return `<div class="slot">
   <div class="flip" style="--rc:${col}">
     <div class="face back"><i>W</i></div>
     <div class="face front ${hi?'hi':''}">
       <div class="bar"></div>
       ${isNew?'<span class="new">Nouveau</span>':''}
       <img src="https://www.wiki-masters.com/cards/${s}.${e}" alt="${n}">
       <div class="m"><div class="n">${n}</div><div class="r">${label}</div></div>
     </div>
   </div></div>`;
}).join('');

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function openPack(){
  const pack=document.getElementById('pack');
  if(pack.dataset.busy)return; pack.dataset.busy=1;
  pack.classList.add('busy');
  const go=()=>{
    document.getElementById('ready').style.display='none';
    document.getElementById('revealScreen').style.display='flex';
    [...document.querySelectorAll('.flip')].forEach((f,i)=>setTimeout(()=>f.classList.add('shown'),reduce?0:200*i+80));
  };
  reduce?go():setTimeout(go,460);
}
</script>
</body>
</html>
